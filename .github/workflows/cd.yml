name: CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Incrementar versión en README
        shell: bash
        run: |
          CURRENT=$(grep -oP 'AppVersion-\K[0-9]+' README.md | head -1)
          if [ -z "$CURRENT" ]; then
            CURRENT=0
          fi
          NEXT=$((CURRENT + 1))
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          if grep -q "AppVersion-$CURRENT" README.md; then
            sed -i "s/AppVersion-$CURRENT.*/AppVersion-$NEXT ($TIMESTAMP)/" README.md
          else
            echo "AppVersion-$NEXT ($TIMESTAMP)" >> README.md
          fi

      - name: Commit y push a main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "CD: bump de versión en README [skip ci]" || echo "Sin cambios que confirmar"
          git push origin main

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Comparar PROD_TOKEN con LOCAL_PROD_TOKEN
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ($env:PROD_TOKEN -eq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Los tokens coinciden"
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
